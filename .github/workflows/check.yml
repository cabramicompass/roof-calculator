name: Calculator checks
# Runs the saved test jobs through the calculator on every update and fails if any
# pressure, approval, attachment or sheet layout result changes unexpectedly.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/check.mjs
